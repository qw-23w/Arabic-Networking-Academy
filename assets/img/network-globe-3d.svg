<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title desc">
  <title id="title">الأرض وشبكات الاتصال</title>
  <desc id="desc">كرة أرضية زرقاء ثلاثية الأبعاد تحيط بها مدارات ونقاط اتصال مترابطة.</desc>
  <defs>
    <radialGradient id="planet" cx="32%" cy="26%" r="78%">
      <stop offset="0" stop-color="#2c93d4"/>
      <stop offset=".43" stop-color="#125995"/>
      <stop offset=".78" stop-color="#092d55"/>
      <stop offset="1" stop-color="#031426"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#84e4e8" stop-opacity=".92"/>
      <stop offset="1" stop-color="#3782b5" stop-opacity=".72"/>
    </linearGradient>
    <radialGradient id="edge" cx="37%" cy="30%" r="75%">
      <stop offset=".62" stop-color="#061b31" stop-opacity="0"/>
      <stop offset=".88" stop-color="#020b17" stop-opacity=".25"/>
      <stop offset="1" stop-color="#010711" stop-opacity=".8"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#57d8f2" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#84eafa"/>
      <stop offset="1" stop-color="#ff9e48" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sphere"><circle cx="320" cy="174" r="124"/></clipPath>
    <style>
      .orbit-dash{stroke-dasharray:2 12;animation:orbit-drift 30s linear infinite}
      .signal-pulse{transform-box:fill-box;transform-origin:center;animation:signal-pulse 2.8s ease-in-out infinite alternate}
      @keyframes orbit-drift{to{stroke-dashoffset:-280}}
      @keyframes signal-pulse{to{opacity:.42;transform:scale(.82)}}
      @media(prefers-reduced-motion:reduce){.orbit-dash,.signal-pulse{animation:none}}
    </style>
  </defs>
  <ellipse cx="320" cy="340" rx="170" ry="14" fill="#1486bd" opacity=".14"/>
  <ellipse cx="320" cy="340" rx="125" ry="8" fill="#42b7d7" opacity=".13"/>
  <g transform="rotate(-12 320 174)" fill="none" stroke="url(#orbit)" stroke-width="1.5">
    <ellipse cx="320" cy="174" rx="238" ry="58" opacity=".42"/>
    <path d="M82 174a238 58 0 0 0 476 0" stroke-width="2.5" opacity=".84"/>
    <path class="orbit-dash" d="M86 174a234 55 0 0 1 468 0" opacity=".86"/>
  </g>
  <circle cx="320" cy="174" r="127" fill="#36b9e8" opacity=".12" filter="url(#glow)"/>
  <circle cx="320" cy="174" r="124" fill="url(#planet)" stroke="#7bd9f5" stroke-opacity=".8" stroke-width="1.5"/>
  <g clip-path="url(#sphere)">
    <g fill="none" stroke="#82d8f5" stroke-opacity=".2" stroke-width="1">
      <ellipse cx="320" cy="174" rx="39" ry="123"/>
      <ellipse cx="320" cy="174" rx="82" ry="123"/>
      <path d="M197 174h246M205 132q115 32 230 0M205 216q115-32 230 0M230 91q90 28 180 0M230 257q90-28 180 0"/>
    </g>
    <g fill="url(#land)" stroke="#a6f1ee" stroke-opacity=".28" stroke-width="1">
      <path d="M221 104l17-16 21 4 12 13 20 2 7 11-12 10-19-4-8 13-18 2-9 18-17-4-8-19-15-5 4-16 17-9zM269 150l20 4 14 14-3 17-14 17-7 24-14 18-12-5 3-24-13-16 4-22 13-11z"/>
      <path d="M313 96l16-13 17 5 9 13 18 1 13 13 21 1 17 13-9 12-19-2-8 12-17-4-12 14-19-7-11-13-19 1-12-13-15-3-3-15 14-4zM361 170l17 4 12 15-5 17-14 10-5 21-15 17-10-13 4-18-12-12 5-17 10-9z"/>
      <path d="M414 223l15 5 9 13-8 13-17-3-9-12zM281 75l13-8 13 5-3 13-14 3z"/>
    </g>
    <g fill="none" stroke="#e1fbff" stroke-opacity=".65" stroke-width="1.2">
      <path d="M231 150Q276 96 321 144T405 133M255 201Q309 154 346 195T411 183M249 119Q315 194 391 111"/>
    </g>
    <g fill="#ffb45f" filter="url(#glow)">
      <circle cx="231" cy="150" r="3.5"/><circle cx="321" cy="144" r="3"/><circle cx="405" cy="133" r="3.5"/><circle cx="346" cy="195" r="3"/>
    </g>
    <circle cx="405" cy="133" r="8" fill="none" stroke="#ffb45f" stroke-opacity=".7" class="signal-pulse"/>
    <circle cx="320" cy="174" r="124" fill="url(#edge)"/>
    <path d="M213 105a124 124 0 0 1 211-14" fill="none" stroke="#c7f5ff" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
  </g>
  <circle cx="320" cy="174" r="124" fill="none" stroke="#8fe7fc" stroke-opacity=".38"/>
  <g transform="rotate(-12 320 174)" fill="none" stroke="url(#orbit)" stroke-width="2.2">
    <path d="M82 174a238 58 0 0 0 476 0" opacity=".78"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="94" cy="211" r="4" fill="#61e1fa"/><circle cx="548" cy="139" r="4" fill="#ffad61"/>
  </g>
</svg>
